<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Abdelrhman Abdelaal, Senior Frontend Engineer</title>
  <desc id="desc">React, Next.js and TypeScript. Every shipped build scores 100 in all four Lighthouse categories.</desc>
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .name { font-size: 54px; font-weight: 800; fill: #f0f6fc; letter-spacing: -1px; }
      .role { font-size: 24px; font-weight: 600; fill: url(#titleGrad); }
      .eyebrow { font-size: 15px; fill: #8b949e; letter-spacing: 1px; }
      .tag { font-size: 18px; fill: #c9d1d9; opacity: 0; animation: rotate 16s infinite; }
      .tag:nth-of-type(2) { animation-delay: 4s; }
      .tag:nth-of-type(3) { animation-delay: 8s; }
      .tag:nth-of-type(4) { animation-delay: 12s; }
      .cursor { fill: #5eead4; animation: blink 1.1s steps(1) infinite; }
      .track { fill: none; stroke: #0cce6b; stroke-opacity: 0.16; stroke-width: 6; }
      .ring { fill: none; stroke: #0cce6b; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 239; stroke-dashoffset: 239; transform: rotate(-90deg); transform-origin: center; transform-box: fill-box; animation: draw 1.6s cubic-bezier(.2,.7,.2,1) forwards; }
      .score { font-size: 26px; font-weight: 700; fill: #0cce6b; text-anchor: middle; opacity: 0; animation: fade 0.6s ease 1.2s forwards; }
      .label { font-size: 13px; fill: #8b949e; text-anchor: middle; }
      .g2 .ring { animation-delay: .15s; } .g2 .score { animation-delay: 1.35s; }
      .g3 .ring { animation-delay: .3s; }  .g3 .score { animation-delay: 1.5s; }
      .g4 .ring { animation-delay: .45s; } .g4 .score { animation-delay: 1.65s; }
      .glowA { animation: driftA 14s ease-in-out infinite alternate; }
      .glowB { animation: driftB 18s ease-in-out infinite alternate; }
      .sweep { animation: sweep 6s linear infinite; }
      @keyframes rotate { 0% { opacity: 0; transform: translateY(6px); } 4% { opacity: 1; transform: translateY(0); } 22% { opacity: 1; } 26% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 0; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(90px, 40px); } }
      @keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-80px, -50px); } }
      @keyframes sweep { from { transform: translateX(-600px); } to { transform: translateX(1200px); } }
      @media (prefers-reduced-motion: reduce) {
        .tag, .cursor, .ring, .score, .glowA, .glowB, .sweep { animation: none; }
        .tag { opacity: 0; } .tag:nth-of-type(1) { opacity: 1; }
        .ring { stroke-dashoffset: 0; } .score { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <g class="glowA"><circle cx="160" cy="40" r="320" fill="url(#glowA)"/></g>
    <g class="glowB"><circle cx="1080" cy="300" r="300" fill="url(#glowB)"/></g>
    <g class="sweep"><rect x="0" y="0" width="600" height="2" fill="url(#lineGrad)"/></g>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#30363d"/>
  </g>

  <g class="sans">
    <text x="64" y="92" class="mono eyebrow">~/abdelaal.dev</text>
    <text x="64" y="150" class="name">Abdelrhman Abdelaal</text>
    <text x="64" y="192" class="role">Senior Frontend Engineer</text>

    <g transform="translate(64, 238)">
      <text class="tag" y="0">React · Next.js · TypeScript · Tailwind</text>
      <text class="tag" y="0">Bilingual Arabic / English, RTL-first interfaces</text>
      <text class="tag" y="0">Government platforms for clients across the UAE &amp; KSA</text>
      <text class="tag" y="0">.NET APIs behind the frontends I ship</text>
    </g>
    <text x="64" y="272" class="mono eyebrow">&gt; <tspan class="cursor">▍</tspan></text>
  </g>

  <g class="sans" transform="translate(760, 0)">
    <text x="192" y="78" class="mono eyebrow" text-anchor="middle">LIGHTHOUSE · EVERY SHIPPED BUILD · MOBILE + DESKTOP</text>

    <g class="g1" transform="translate(48, 156)">
      <circle class="track" r="38"/><circle class="ring" r="38"/>
      <text class="score" y="9">100</text>
      <text class="label" y="70">Performance</text>
    </g>
    <g class="g2" transform="translate(144, 156)">
      <circle class="track" r="38"/><circle class="ring" r="38"/>
      <text class="score" y="9">100</text>
      <text class="label" y="70">Accessibility</text>
    </g>
    <g class="g3" transform="translate(240, 156)">
      <circle class="track" r="38"/><circle class="ring" r="38"/>
      <text class="score" y="9">100</text>
      <text class="label" y="70">Best Practices</text>
    </g>
    <g class="g4" transform="translate(336, 156)">
      <circle class="track" r="38"/><circle class="ring" r="38"/>
      <text class="score" y="9">100</text>
      <text class="label" y="70">SEO</text>
    </g>
  </g>
</svg>
